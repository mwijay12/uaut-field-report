<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | Altraware Technology</title>
    <meta name="description" content="Manage the Altraware site: phone lines, prices, backgrounds, search and where briefs are saved." />
    <!-- Never listed, whatever the switch for the rest of the site says. vercel.json sends the same as a header. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#071022" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/admin/admin.css" />
    <script type="module" src="/src/admin/main.js"></script>
  </head>
  <body>
    <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
      <symbol id="a-out" viewBox="0 0 20 20"><path d="M6 14l8-8M7 6h7v7" fill="none" stroke="currentColor" stroke-width="1.5" /></symbol>
      <symbol id="a-check" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="1.5" /></symbol>
      <symbol id="a-arrow" viewBox="0 0 20 20"><path d="M3 10h13M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" /></symbol>
      <symbol id="a-alert" viewBox="0 0 20 20"><path d="M10 3l8 14H2zM10 8v4.5M10 14.6v.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></symbol>
      <symbol id="a-dot" viewBox="0 0 20 20"><circle cx="10" cy="10" r="4" fill="currentColor" /></symbol>
      <symbol id="a-close" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.5" /></symbol>
    </svg>

    <div id="app" class="app">
      <noscript><p class="notice">The admin needs JavaScript. The site itself does not.</p></noscript>
    </div>
  </body>
</html>
