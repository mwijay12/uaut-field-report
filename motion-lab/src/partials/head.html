<meta property="og:type" content="website" />
<meta property="og:locale" content="en_GB" />
<meta property="og:title" content="{{title}}" data-head />
<meta property="og:description" content="{{description}}" data-head />
<meta property="og:image" content="{{image}}" />
<meta property="og:image:width" content="1200" />

<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preload" href="/src/fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/src/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<script>
  // Runs before first paint. Marks that scripting works and whether the
  // visitor asked for less motion. If the main script never arrives, the
  // timer shows the content anyway.
  (function (root) {
    root.classList.add('js');
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('reduced-motion');
    setTimeout(function () { root.classList.add('is-ready'); }, 6000);
  })(document.documentElement);
</script>
<link rel="stylesheet" href="/src/styles/index.css" />
<script type="module" src="/src/main.js"></script>
